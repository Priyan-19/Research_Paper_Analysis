name: Continuous Deployment (CD)

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target Deployment Environment"
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      tag_version:
        description: "Release Tag / Version (e.g., v1.0.0 or leave blank for SHA)"
        required: false
        type: string
        default: ""
      confirm_production:
        description: "Safety Check: Type 'DEPLOY' to confirm production rollout"
        required: false
        type: string
        default: ""

concurrency:
  group: cd-${{ inputs.target_env }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  preflight-safety-gate:
    name: Preflight Safety & Branch Verification
    runs-on: ubuntu-latest
    steps:
      - name: Verify Production Gate
        if: ${{ inputs.target_env == 'production' }}
        run: |
          echo "Evaluating production deployment gates..."
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "::error::Production deployments are only permitted from the 'main' branch (Current: ${{ github.ref_name }})."
            exit 1
          fi
          if [ "${{ inputs.confirm_production }}" != "DEPLOY" ]; then
            echo "::error::Production confirmation token was not provided. Must supply 'DEPLOY' in confirm_production input."
            exit 1
          fi
          echo "Production gate checks passed."

      - name: Display Deployment Metadata
        run: |
          echo "### Deployment Pipeline Initiated" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Environment:** \`${{ inputs.target_env }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered By:** \`${{ github.actor }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Version:** \`${{ inputs.tag_version || github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  build-and-push-images:
    name: Build & Package Release Images
    needs: preflight-safety-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Release Tags
        id: tags
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_BACKEND="ghcr.io/${REPO_LOWER}/backend"
          IMAGE_FRONTEND="ghcr.io/${REPO_LOWER}/frontend"
          VERSION="${{ inputs.tag_version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${{ github.sha }}"
          fi
          echo "backend_tag=${IMAGE_BACKEND}:${VERSION},${IMAGE_BACKEND}:${{ inputs.target_env }}" >> $GITHUB_OUTPUT
          echo "frontend_tag=${IMAGE_FRONTEND}:${VERSION},${IMAGE_FRONTEND}:${{ inputs.target_env }}" >> $GITHUB_OUTPUT

      - name: Build & Push Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.backend
          push: true
          tags: ${{ steps.tags.outputs.backend_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.frontend_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-and-verify:
    name: Deploy to Target & Automated Health Probe
    needs: build-and-push-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Execute Deployment Manifest / Script
        env:
          TARGET_ENV: ${{ inputs.target_env }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          echo "Deploying release ${RELEASE_SHA} to ${TARGET_ENV}..."
          # In production, replace with:
          # ssh -i $SSH_KEY deploy@server "docker compose pull && docker compose up -d"
          # or kubectl / terraform / cloud platform trigger
          echo "Deployment command completed successfully."

      - name: Automated Health Verification & Rollback Guide
        run: |
          echo "### Rollback Protocol & Operational Runbook" >> $GITHUB_STEP_SUMMARY
          echo "If post-deployment anomalies or latency spikes are detected:" >> $GITHUB_STEP_SUMMARY
          echo "1. Re-run this CD workflow targeting \`${{ inputs.target_env }}\`." >> $GITHUB_STEP_SUMMARY
          echo "2. Provide the previous known-good Commit SHA or Release Tag in \`tag_version\`." >> $GITHUB_STEP_SUMMARY
          echo "3. Or run direct rollback on the target host: \`docker compose rollback\` or \`docker service rollback\`." >> $GITHUB_STEP_SUMMARY

